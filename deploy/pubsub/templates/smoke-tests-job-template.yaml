{{- if .Values.smokeTests.enabled }}
{{- $fullname := include "pubsub.fullname" . }}
{{- $deployment := $fullname }}
# The k6 Job manifest, stored as data so the HelmRelease watcher can `kubectl apply` it.
# Auth: the k6 ServiceAccount token, scoped to get on the Deployment and list on pods in this namespace (sc01, sc02).
# The pod-internal probes (sc02) send no credentials. gRPC is never called. Results: pushed to Cortex via experimental-prometheus-rw.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-smoke-job-template
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: k6-smoke-tests
    app.kubernetes.io/part-of: pubsub
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: job-template
data:
  k6-runner-job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: {{ $fullname }}-smoke-k6
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/name: k6-smoke-tests
        app.kubernetes.io/part-of: pubsub
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: k6-runner
    spec:
      backoffLimit: 1
      # Hard stop so a hung pod cannot linger until the next chart version.
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          annotations:
            # The Job calls pod IPs directly; a Linkerd sidecar would keep the pod from completing.
            linkerd.io/inject: disabled
          labels:
            app.kubernetes.io/name: k6-smoke-tests
            app.kubernetes.io/part-of: pubsub
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: k6-runner
        spec:
          serviceAccountName: {{ $fullname }}-smoke-k6-sa
          # Mounted on purpose: sc01 reads the Deployment and sc02 lists pods through the Kubernetes API with this token.
          automountServiceAccountToken: true
          restartPolicy: Never
          containers:
            - name: k6-runner
              image: {{ required "smokeTests.k6Image is required when smokeTests.enabled" .Values.smokeTests.k6Image }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  # Rebuild the k6 tree from the flat ConfigMap keys:
                  #   main.js -> /work/main.js, config-X -> /work/config/X, helpers-X -> /work/helpers/X,
                  #   tests-X -> /work/tests/X
                  mkdir -p /work/config /work/helpers /work/tests
                  for f in /scripts/*; do
                    key=$(basename "$f")
                    case "$key" in
                      main.js) cp "$f" /work/main.js ;;
                      config-*) cp "$f" "/work/config/${key#config-}" ;;
                      helpers-*) cp "$f" "/work/helpers/${key#helpers-}" ;;
                      tests-*) cp "$f" "/work/tests/${key#tests-}" ;;
                      *) echo "WARN: ignoring unmapped ConfigMap key ${key}" ;;
                    esac
                  done

                  echo "=== pubsub K6 smoke test ==="
                  echo "  Cluster ${TARGET_CLUSTER} (pod-internal probes on :${INTERNAL_PORT}, gRPC not called)"
                  echo "  Deployment ${SMOKE_NAMESPACE}/${DEPLOYMENT_NAME}"
                  echo "  Pods ${SMOKE_NAMESPACE} labelSelector=${POD_LABEL_SELECTOR}"

                  k6 run /work/main.js \
                    --out experimental-prometheus-rw \
                    --tag version="${CHART_VERSION}" \
                    --tag service=pubsub \
                    --tag cluster="{{ include "pubsub.smokeCluster" . }}"
              env:
                - name: TARGET_CLUSTER
                  value: {{ include "pubsub.smokeCluster" . | quote }}
                - name: ALLOWED_CLUSTERS
                  value: {{ required "smokeTests.allowedClusters is required when smokeTests.enabled" .Values.smokeTests.allowedClusters | quote }}
                - name: INTERNAL_PORT
                  value: {{ .Values.internal.port | quote }}
                - name: K8S_API_URL
                  value: "https://kubernetes.default.svc"
                - name: K8S_TOKEN_FILE
                  value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
                - name: SSL_CERT_FILE
                  value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                - name: SMOKE_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: DEPLOYMENT_NAME
                  value: {{ $deployment | quote }}
                # Excludes the k6 Job and watcher pods, which share app.kubernetes.io/instance with the release.
                - name: POD_LABEL_SELECTOR
                  value: {{ printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s,app.kubernetes.io/component notin (k6-runner,hr-watcher)" (include "pubsub.name" .) .Release.Name | quote }}
                # Replaced by the HelmRelease watcher at launch (sed), so the checkpoint can advance after the Job exists.
                - name: CHART_VERSION
                  value: "__CHART_VERSION__"
                - name: K6_PROMETHEUS_RW_SERVER_URL
                  value: {{ required "smokeTests.cortex.url is required when smokeTests.enabled" .Values.smokeTests.cortex.url | quote }}
                - name: K6_PROMETHEUS_RW_HEADERS_X-Scope-OrgID
                  value: {{ required "smokeTests.cortex.orgId is required when smokeTests.enabled" .Values.smokeTests.cortex.orgId | quote }}
                - name: K6_PROMETHEUS_RW_TREND_STATS
                  value: "avg,p(95)"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "300m"
                  memory: "256Mi"
              volumeMounts:
                - name: k6-scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: k6-scripts
              configMap:
                name: {{ $fullname }}-smoke-k6-scripts
                defaultMode: 0644
            - name: work
              emptyDir: {}
{{- end }}
